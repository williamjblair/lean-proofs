name = "lean-proofs"
version = "0.1.0"
keywords = ["math", "formal-proofs", "erdos"]
defaultTargets = ["ErdosProblems", "Palomar", "PalomarSolutions"]
weakLeanArgs = ["-s", "65520"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/ajirving/PrimeNumberTheoremAnd.git"
rev = "769d3b81fb"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d4"

[[lean_lib]]
name = "ErdosProblems"

[[lean_lib]]
name = "Palomar"
# One Challenge per registry entry, Mathlib-only by Palomar's rule. Each is
# built on its own; there is no aggregating root module.
roots = ["Palomar.Erdos730.Challenge", "Palomar.Erdos154.Challenge", "Palomar.Erdos94.Challenge"]

[[lean_lib]]
name = "PalomarSolutions"
# A Solution declares the same names as its Challenge (Comparator compares
# them). Solutions live under their own root module, not under `Palomar`:
# Palomar's verifier puts its recompiled Challenge first on LEAN_PATH, and Lean
# resolves every module sharing that root directory there, so a Solution under
# `Palomar.*` is never found (PalomarSubmission#108).
roots = ["PalomarSolutions.Erdos730", "PalomarSolutions.Erdos154", "PalomarSolutions.Erdos94"]
