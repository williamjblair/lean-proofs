name = "lean-proofs"
version = "0.1.0"
keywords = ["math", "formal-proofs", "erdos"]
defaultTargets = ["ErdosProblems", "Palomar"]
weakLeanArgs = ["-s", "65520"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/ajirving/PrimeNumberTheoremAnd.git"
rev = "769d3b81fb"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d4"

[[lean_lib]]
name = "ErdosProblems"

[[lean_lib]]
name = "Palomar"
# Challenge and Solution declare the same names by design (Comparator compares
# them), so there is no aggregating root module; each is built on its own.
roots = [
  "Palomar.Erdos730.Challenge", "Palomar.Erdos730.Solution",
  "Palomar.Erdos154.Challenge", "Palomar.Erdos154.Solution",
  "Palomar.Erdos94.Challenge", "Palomar.Erdos94.Solution",
]
