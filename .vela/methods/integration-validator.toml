method_id = "integration-validator"
version = "0.1"
inputs = [
  "Vela Core integration checker@c1a34373c2cdd937ed34fd128174a66fa12be71a",
  "vela.toml and its rooted Profile, Binding, and Method inventory",
  "proofs.yaml with 69 source-owned proof mappings",
  ".vela/examples/erdos-94-exact-reference.toml and its exact closure",
]
outputs = ["scoped integration conformance result", "optional verification input"]
limitations = [
  "Vela Core validates the shared rooted Manifest, Profile, Binding, Method, and Exact Reference waist before source-owned checks run.",
  "The source-local validator retains proofs.yaml, Lean declaration, toolchain, build, axiom, external identity, and portable-example semantics; it is not a Protocol 1 verifier.",
  "The emitted verification input uses a source-owned unrooted schema, binds exact inputs only, and records no outcome or availability; INT-00 defines no shared check-result document or fifth root domain.",
]
nonclaims = [
  "Integration conformance is not scientific acceptance, a Vela Decision, or Standing.",
]
authority_effect = "none"

