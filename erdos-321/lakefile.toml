name = "Erdos321Verifier"
defaultTargets = ["Research"]

# The bundle vendors PrimeNumberTheoremAnd as a lean_lib. Substitute upstream
# PNT @ a7eb3a8, the same way erdos-796 and erdos-959 do, so no third-party
# project is vendored here. Mathlib is the rev the bundle already pinned, which
# is also the one 796 builds against.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "a7eb3a8ae4bde79292fb5f04c32cd5ab6d8f226c"

# The bundle also ships an `Architect` library, which the proof does not import: nothing under
# `Research/`, nor `Audit.lean` or `Erdos321Statement.lean`, mentions it. Upstream PNT pulls in
# `LeanArchitect`, which provides the same `Architect.*` modules, so declaring the vendored copy
# as a library here makes the two packages ambiguous and the build fails with
# "could not disambiguate the module `Architect.Basic`". The sources are left in place, they are
# just not a build target.

[[lean_lib]]
name = "Research"

[[lean_lib]]
name = "Erdos321Statement"
