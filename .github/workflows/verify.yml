name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A green run is a scoped build and axiom result: every hosted proof compiles
# against the pinned Mathlib and depends only on
# [propext, Classical.choice, Quot.sound]. It is not acceptance or Standing.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs elan from lean-toolchain, restores the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Axiom audit (no sorry, kernel axioms only)
        run: bash scripts/check_axioms.sh

      - name: Manifest is in sync
        run: bash scripts/check_manifest.sh

      - name: Build the published Vela Core integration checker
        env:
          VELA_CORE_REVISION: 329487f29ad4c6313a2be7c091d46085b61ff03b
        run: |
          git clone --filter=blob:none https://github.com/vela-science/vela.git "$RUNNER_TEMP/vela-core"
          git -C "$RUNNER_TEMP/vela-core" checkout --detach "$VELA_CORE_REVISION"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --locked -p vela-cli --manifest-path "$RUNNER_TEMP/vela-core/Cargo.toml"
          echo "VELA_BIN=$RUNNER_TEMP/vela-core/target/debug/vela" >> "$GITHUB_ENV"

      - name: Native integration contracts are exact
        run: |
          python3 scripts/check_vela_integration.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      # Tamper-evident proof evidence: regenerate attestations.json (file +
      # lake-manifest + audit-output hashes, axiom footprint) and fail if the
      # committed copy drifted. Reproducible across machines, so no auto-commit.
      - name: Proof attestations are in sync
        run: |
          pip install --quiet pyyaml
          python3 scripts/emit_attestations.py
          git diff --exit-code attestations.json
