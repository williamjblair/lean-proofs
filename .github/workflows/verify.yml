name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A green run is a scoped build and axiom result: every hosted proof compiles
# against the pinned Mathlib and depends only on
# [propext, Classical.choice, Quot.sound]. It is not acceptance or Standing.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs elan from lean-toolchain, restores the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Axiom audit (no sorry, kernel axioms only)
        run: bash scripts/check_axioms.sh

      - name: Manifest is in sync
        run: bash scripts/check_manifest.sh

      - name: Build the published Vela Core integration checker
        env:
          VELA_CORE_REVISION: c1a34373c2cdd937ed34fd128174a66fa12be71a
        run: |
          git clone --filter=blob:none https://github.com/vela-science/vela.git "$RUNNER_TEMP/vela-core"
          git -C "$RUNNER_TEMP/vela-core" checkout --detach "$VELA_CORE_REVISION"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build --locked -p vela-cli --manifest-path "$RUNNER_TEMP/vela-core/Cargo.toml"
          echo "VELA_BIN=$RUNNER_TEMP/vela-core/target/debug/vela" >> "$GITHUB_ENV"

      - name: Native integration contracts are exact
        run: |
          python3 scripts/check_vela_integration.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      # Tamper-evident proof evidence: regenerate attestations.json (file +
      # lake-manifest + audit-output hashes, axiom footprint) and fail if the
      # committed copy drifted. Reproducible across machines, so no auto-commit.
      - name: Proof attestations are in sync
        run: |
          pip install --quiet pyyaml
          python3 scripts/emit_attestations.py
          git diff --exit-code attestations.json

  # Replays each registry statement through Comparator: the Challenge (Mathlib
  # only) against the Solution (the proof here), permitting only the three
  # standard axioms. scripts/fake-landrun.sh stands in for the Linux sandbox,
  # so this is a reproduction of the check, not the trusted run; Palomar's own
  # verifier performs that one with landrun and NanoDa.
  comparator:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: Palomar

      - name: Build Comparator and a lean4export for this toolchain
        env:
          COMPARATOR_REV: 2a00b30df5e9173e70c4e4ec669fdf03da3163b9
        run: |
          TOOLCHAIN_TAG="$(sed 's#.*:##' lean-toolchain)"
          git clone https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout "$COMPARATOR_REV"
          (cd "$RUNNER_TEMP/comparator" && lake build comparator:exe)
          git clone https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout "$TOOLCHAIN_TAG"
          (cd "$RUNNER_TEMP/lean4export" && lake build)
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/comparator/scripts/fake-landrun.sh" "$RUNNER_TEMP/bin/landrun"
          ln -s "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" "$RUNNER_TEMP/bin/lean4export"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "COMPARATOR_BIN=$RUNNER_TEMP/comparator/.lake/build/bin/comparator" >> "$GITHUB_ENV"

      - name: Every registry statement is accepted
        run: |
          for cfg in Palomar/*/comparator.json; do
            echo "== $cfg"
            lake env "$COMPARATOR_BIN" "$cfg"
          done
