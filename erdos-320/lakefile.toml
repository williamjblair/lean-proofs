name = "Research"
defaultTargets = ["ResearchPNT"]

# The bundle vendors PrimeNumberTheoremAnd and wires it in with a path require.
# Substitute upstream PNT @ a7eb3a8 against the cached Mathlib fabf563a, the same
# way erdos-796 and erdos-959 do, so no third-party project is vendored here.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "a7eb3a8ae4bde79292fb5f04c32cd5ab6d8f226c"

[[lean_lib]]
name = "Research"

[[lean_lib]]
name = "ResearchPNT"
